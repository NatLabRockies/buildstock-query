[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buildstock_query"
version = "0.4.0"
description = "Python library for querying and analyzing ResStock and ComStock"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.12"
authors = [
    { name = "Rajendra Adhikari", email = "Rajendra.Adhikari@nrel.gov" },
]
dependencies = [
    "pandas >= 2.0.0",
    "polars",
    "pyarrow >= 14.0.1",
    "pyathena >= 3.19.0",
    "SQLAlchemy >= 2.0.0",
    "pandas-stubs",
    "inquirerpy >= 0.3.4",
    "types-PyYAML >= 6.0.12.2",
    "pydantic>=2",
    "PyYAML",
    "tabulate",
    "toml",
    "requests",
    "sqlglot",
    "filelock",
    "pyparsing",
    "tqdm",
    "altair>=6.1.0",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.9.0.post1",
    "nbformat>=5.10.4",
    "nbclient>=0.10.4",
    "ruff>=0.15.12",
    "ty>=0.0.35",
    "complexipy>=5.4.1",
]

[project.optional-dependencies]
full = [
    "dash-bootstrap-components >= 1.2.1",
    "dash-extensions >= 0.1.6",
    "dash-mantine-components == 0.10.2",
    "dash-iconify >= 0.1.2",
    "plotly >= 5.10.0",
    "dash >= 2.6.2",
]

[dependency-groups]
dev = [
    "pytest >= 7.1.3",
    "flake8 >= 5.0.4",
    "pdoc3 >= 0.10.0",
    "dash-bootstrap-components >= 1.2.1",
    "dash-extensions >= 0.1.6",
    "dash-mantine-components == 0.10.2",
    "dash-iconify >= 0.1.2",
    "coverage >= 6.5.0",
    "plotly >= 5.10.0",
    "dash >= 2.6.2",
    "ipywidgets>=8.1.8",
]

[project.scripts]
upgrades_analyzer = "buildstock_query.tools.upgrades_analyzer:main"
upgrades_visualizer = "buildstock_query.tools.upgrades_visualizer:main"

[project.urls]
Homepage = "https://github.com/NREL/buildstock-query"
Documentation = "https://github.com/NREL/buildstock-query/wiki"
Repository = "https://github.com/NREL/buildstock-query"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    ".bsq_cache*",
    ".history",
    "build",
    "htmlcov",
    "docs",
    "example_usage",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "ARG",    # unused function arguments
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
    "PIE",    # flake8-pie
    "PL",     # pylint (subset)
]
ignore = [
    "E501",    # line too long — formatter handles this
    "B008",    # function call in default arg (common with pydantic Field, FastAPI Depends)
    "PLR0913", # too many arguments
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLR2004", # magic value comparison
    "SIM108",  # ternary instead of if-else (often less readable)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]
"__init__.py" = ["F401"]  # allow re-exports
"buildstock_query/tools/upgrades_visualizer/upgrades_visualizer.py" = ["ARG001"]  # Dash callback signatures

[tool.ruff.lint.isort]
known-first-party = ["buildstock_query"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.src]
include = ["buildstock_query/**"]
exclude = ["buildstock_query/tools/upgrades_visualizer/**"]

[tool.ty.environment]
python = ".venv/"

[tool.hatch.build.targets.wheel]
packages = ["buildstock_query"]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests",
    "docs",
    "example_usage",
    "htmlcov",
    "build",
    ".bsq_cache*",
    ".history",
    "*.ipynb",
    "*.coverage",
    ".git",
    ".github",
    ".vscode",
    ".pytest_cache",
]
